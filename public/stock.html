el>Quantité<input name="quantity" type="number" step="0.1" min="0" required></label><label>Unité<select name="unit"><option>kg</option><option>L</option><option>pièces</option></select></label></div><label>Seuil d'alerte<input name="threshold" type="number" step="0.1" min="0" value="1" required></label><button class="button button--dark" type="submit">Ajouter au stock <span>↗</span></button></form><div id="stock-message" role="status"></div></aside></section></main><script src="js/shared.js"></script><script src="js/stock.js"></script></body></html>
