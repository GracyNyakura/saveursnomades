<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Saveurs Nomades</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <img src="logo.svg" alt="Saveurs Nomades" class="logo logo--brand">
      <div class="brand-text"><h1>Saveurs Nomades</h1><p class="tag">Cuisine du monde, esprit nomade</p></div>
    </div>
  </header>

  <main class="container">
    <section id="menus">
      <h2>Nos Menus</h2>
      <div id="menus-list"></div>
    </section>

    <section id="reservation">
      <h2>Réserver une table</h2>
      <form id="reservation-form">
        <label>Nom<input name="name" required></label>
        <label>Email<input name="email" type="email" required></label>
        <label>Téléphone<input name="phone"></label>
        <label>Personnes<input name="party" type="number" min="1" value="2" required></label>
        <label>Date<input name="date" type="date" required></label>
        <label>Heure<input name="time" type="time" required></label>
        <label>Notes<textarea name="notes"></textarea></label>
        <button type="submit">Envoyer</button>
      </form>
      <div id="res-message" role="status" aria-live="polite"></div>
    </section>
  </main>

  <footer class="site-footer">© Saveurs Nomades</footer>

  <script>
    const defaultMenus = [
      { id: 1, name: 'Menu Découverte', price: '$28', items: ['Entrée du moment', 'Plat au choix', 'Dessert'] },
      { id: 2, name: 'Menu Nomade', price: '$42', items: ['Apéro', 'Entrée', 'Plat', 'Dessert'] },
      { id: 3, name: 'Menu Grande Traversée', price: '$58', items: ['Deux entrées à partager', 'Plat signature', 'Dessert', 'Cocktail maison'] }
    ];

    function renderMenus(menus) {
      const container = document.getElementById('menus-list');
      container.innerHTML = menus.map(m => `
        <article class="menu">
          <h3>${m.name} — ${m.price}</h3>
          <ul>${m.items.map(i => `<li>${i}</li>`).join('')}</ul>
        </article>`).join('');
    }

    async function loadMenus() {
      try {
        const res = await fetch('/api/menus');
        if (!res.ok) throw new Error('API inaccessible');
        const menus = await res.json();
        renderMenus(menus);
      } catch (error) {
        renderMenus(defaultMenus);
      }
    }

    document.getElementById('reservation-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target).entries());
      const msg = document.getElementById('res-message');

      try {
        const res = await fetch('/api/reservations', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        if (!res.ok) throw new Error('Réservation impossible');
        await res.json();
        msg.textContent = 'Réservation confirmée. Merci !';
        e.target.reset();
      } catch (error) {
        msg.textContent = 'Prévisualisation locale : réservation simulée. Merci !';
        e.target.reset();
      }
    });

    loadMenus();
  </script>
</body>
</html>
